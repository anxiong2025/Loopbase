<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
  <title>Loopbase 金融分析</title>
  <style>
    :root {
      --bg: #f6f1e4;
      --card: #fffdf7;
      --border: #e6dcc4;
      --border-soft: #efe6d0;
      --text: #2f2a20;
      --muted: #8c8168;
      --accent: #a9762c;
      --accent-dark: #8a5f1f;
      --accent-soft: #f1e0bd;
      --accent-soft-text: #7a5620;
      --ok: #6b8f5e;
      --err: #b3554a;
      --user-bubble: var(--accent);
      --user-text: #fffaf0;
      --shadow: rgba(60, 45, 20, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app { max-width: 1320px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 12px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .header-side {
      width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--muted); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; flex: none;
      transition: color .15s, border-color .15s;
    }
    .header-side:hover { color: var(--accent); border-color: var(--accent); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; flex: none;
      background: linear-gradient(135deg, #c8965b, var(--accent-dark));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; box-shadow: 0 2px 6px var(--shadow);
    }
    .title { font-weight: 600; font-size: 15px; letter-spacing: .2px; }
    .sub { font-size: 11.5px; color: var(--muted); }
    .header-fill { flex: 1; }
    .disclaimer { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

    /* ---------- 三栏布局 ---------- */
    .layout { flex: 1; min-height: 0; display: flex; }

    .panel {
      width: 250px; flex: none; background: var(--card); overflow: hidden;
      transition: width .18s ease, opacity .18s ease, padding .18s ease;
      display: flex; flex-direction: column;
    }
    .panel-left { border-right: 1px solid var(--border); }
    .panel-right { border-left: 1px solid var(--border); }
    .app.hide-left .panel-left,
    .app.hide-right .panel-right { width: 0; opacity: 0; }

    .panel-head {
      padding: 12px 16px; font-size: 12.5px; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--border-soft); flex: none; white-space: nowrap;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 12px 14px; min-width: 250px; }
    .panel-body::-webkit-scrollbar { width: 6px; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    .empty-hint { font-size: 12px; color: var(--muted); line-height: 1.7; }

    /* 步骤列表（左栏） */
    .steps-run + .steps-run { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .steps-q { font-size: 12px; color: var(--text); font-weight: 600; margin-bottom: 8px; word-break: break-word; }
    .step { position: relative; padding: 6px 0 6px 16px; border-left: 2px solid var(--border-soft); margin-left: 4px; }
    .step:last-child { border-left-color: transparent; }
    .step::before {
      content: ''; position: absolute; left: -5px; top: 11px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--border); border: 2px solid var(--card);
    }
    .step.pending::before { background: #d8b968; animation: pulse 1.1s infinite ease-in-out; }
    .step.done::before { background: var(--ok); }
    .step.error::before { background: var(--err); }
    .step.warn::before { background: #c98a3a; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(216,185,104,.5); } 50% { box-shadow: 0 0 0 4px rgba(216,185,104,0); } }
    .step-label { font-size: 12.5px; line-height: 1.5; }
    .step-caption { font-size: 11px; color: var(--muted); margin-top: 2px; word-break: break-word; }

    /* 配置 + 轨迹（右栏） */
    .cfg-row { margin-bottom: 12px; }
    .cfg-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .cfg-value { font-size: 12.5px; line-height: 1.6; word-break: break-word; }
    .cfg-row input[type="number"] {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; font-family: inherit; background: var(--bg); color: var(--text); outline: none;
    }
    .cfg-row input[type="number"]:focus { border-color: var(--accent); }
    .panel-sub {
      font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase;
      letter-spacing: .04em; margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid var(--border-soft);
    }
    .trace-log { display: flex; flex-direction: column; gap: 5px; }
    .trace-line {
      font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted); line-height: 1.5; word-break: break-word;
    }
    .trace-line .t { color: var(--accent); margin-right: 4px; }

    /* ---------- 中间聊天区 ---------- */
    .center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    main {
      flex: 1; overflow-y: auto; padding: 22px 20px 10px;
      display: flex; flex-direction: column; align-items: center;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    .center-inner { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px; }

    .msg { max-width: 88%; animation: rise .18s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .msg.user {
      align-self: flex-end; background: var(--user-bubble); color: var(--user-text);
      padding: 12px 16px; border-radius: 16px; border-bottom-right-radius: 4px;
      line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.assistant {
      align-self: flex-start; max-width: 96%;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      border-bottom-left-radius: 4px; box-shadow: 0 1px 3px var(--shadow);
      overflow: hidden;
    }
    .msg.assistant .msg-body { padding: 14px 18px; line-height: 1.7; font-size: 14px; }

    .msg.typing { display: flex; align-items: center; gap: 8px; padding: 14px 18px; color: var(--muted); font-size: 13px; }
    .dots { display: inline-flex; gap: 4px; }
    .dots span {
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

    .msg-run { border-top: 1px solid var(--border-soft); background: #fbf7ec; }
    .msg-run summary {
      cursor: pointer; list-style: none; padding: 8px 18px; font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 6px; user-select: none;
    }
    .msg-run summary::-webkit-details-marker { display: none; }
    .msg-run summary::before { content: '▸'; font-size: 10px; transition: transform .15s; color: var(--accent); }
    .msg-run[open] summary::before { transform: rotate(90deg); }
    .run-tools { padding: 0 18px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tool-chip {
      background: var(--accent-soft); color: var(--accent-soft-text); font-size: 11.5px;
      padding: 3px 10px; border-radius: 999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .examples { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
    .example-chip {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      font-size: 12.5px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .example-chip:hover { border-color: var(--accent); color: var(--accent-dark); }

    form {
      padding: 14px 20px 18px; background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: center;
    }
    .form-inner { width: 100%; max-width: 720px; display: flex; gap: 10px; align-items: flex-end; }
    textarea {
      flex: 1; resize: none; min-height: 46px; max-height: 160px; padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
      font-size: 14px; font-family: inherit; color: var(--text); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    button {
      padding: 0 24px; height: 46px; border: 0; border-radius: 14px;
      background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { opacity: .5; cursor: default; }

    .msg h1, .msg h2, .msg h3 { margin: 14px 0 6px; line-height: 1.35; color: var(--text); }
    .msg h1 { font-size: 18px; } .msg h2 { font-size: 16px; } .msg h3 { font-size: 15px; }
    .msg p { margin: 6px 0; }
    .msg ul, .msg ol { margin: 6px 0; padding-left: 22px; }
    .msg table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
    .msg th, .msg td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .msg th { background: var(--bg); font-weight: 600; }
    .msg blockquote { border-left: 3px solid var(--accent); margin: 8px 0; padding: 2px 0 2px 12px; color: var(--muted); }
    .msg hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
    .msg pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
    .msg code { background: var(--accent-soft); color: var(--accent-soft-text); padding: 1px 5px; border-radius: 4px; font-size: 13px; }

    @media (max-width: 980px) {
      .panel-left, .panel-right { position: absolute; top: 0; bottom: 0; z-index: 5; box-shadow: 0 0 20px rgba(0,0,0,.15); }
      .panel-left { left: 0; } .panel-right { right: 0; }
      .app:not(.hide-left) .panel-left,
      .app:not(.hide-right) .panel-right { width: 250px; }
      .layout { position: relative; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <button class="header-side" id="toggleLeft" title="显示/隐藏分析步骤">‹</button>
      <div class="brand">
        <div class="logo">L</div>
        <div>
          <div class="title">Loopbase 金融分析</div>
          <div class="sub">Agent Loop · 内核 + 金融工具</div>
        </div>
      </div>
      <div class="header-fill"></div>
      <div class="disclaimer">仅供参考 · 非投资建议</div>
      <button class="header-side" id="toggleRight" title="显示/隐藏运行配置">›</button>
    </header>

    <div class="layout">
      <aside class="panel panel-left">
        <div class="panel-head">分析步骤</div>
        <div class="panel-body" id="steps">
          <div class="empty-hint" id="stepsHint">发起一次分析后，这里会实时显示模型的每一轮思考与工具调用。</div>
        </div>
      </aside>

      <div class="center">
        <main><div class="center-inner" id="chat"></div></main>
        <form id="form">
          <div class="form-inner">
            <textarea id="q" placeholder="输入问题，例如：分析一下特斯拉（TSLA）　·　Enter 发送，Shift+Enter 换行" rows="1"></textarea>
            <button id="btn" type="submit">发送</button>
          </div>
        </form>
      </div>

      <aside class="panel panel-right">
        <div class="panel-head">分析配置</div>
        <div class="panel-body">
          <div class="cfg-row">
            <label>模型</label>
            <div class="cfg-value" id="cfgModel">加载中…</div>
          </div>
          <div class="cfg-row">
            <label>数据源 / 工具</label>
            <div class="cfg-value" id="cfgTools">加载中…</div>
          </div>
          <div class="cfg-row">
            <label>轮数上限</label>
            <input type="number" id="cfgMaxTurns" min="1" max="10" value="5">
          </div>
          <div class="panel-sub">实时轨迹</div>
          <div class="trace-log" id="trace">
            <div class="empty-hint">等待运行…</div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ---------- 极简 Markdown 渲染（表格/标题/加粗/列表/引用/代码） ----------
    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function renderMd(md) {
      const lines = escapeHtml(md).split('\n');
      let html = '', inTable = false, inList = null;
      const closeTable = () => { if (inTable) { html += '</tbody></table>'; inTable = false; } };
      const closeList = () => { if (inList) { html += '</' + inList + '>'; inList = null; } };
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const t = line.trim();
        if (!t) { closeTable(); closeList(); html += '\n'; continue; }
        if (t.startsWith('|')) {
          if (/^\|[\s:|-]+\|$/.test(t)) continue;           // 表格分隔行
          const cells = t.split('|').slice(1, -1).map(c => c.trim());
          if (!inTable) {
            html += '<table><thead><tr>' + cells.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
            inTable = true;
          } else {
            html += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
          }
          continue;
        }
        closeTable();
        const h = t.match(/^(#{1,3})\s+(.*)/);
        if (h) { closeList(); html += '<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>'; continue; }
        if (t.startsWith('---')) { closeList(); html += '<hr>'; continue; }
        if (t.startsWith('&gt;')) { closeList(); html += '<blockquote>' + t.slice(4).trim() + '</blockquote>'; continue; }
        if (t.startsWith('- ')) {
          if (inList !== 'ul') { closeList(); html += '<ul>'; inList = 'ul'; }
          html += '<li>' + t.slice(2).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') + '</li>'; continue;
        }
        if (/^\d+\.\s/.test(t)) {
          if (inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
          html += '<li>' + t.replace(/^\d+\.\s/, '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') + '</li>'; continue;
        }
        closeList();
        html += '<p>' + t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') + '</p>';
      }
      closeTable(); closeList();
      return html;
    }

    function truncate(s, n) {
      s = String(s == null ? '' : s);
      return s.length > n ? s.slice(0, n) + '…' : s;
    }

    // ---------- DOM refs ----------
    const appEl = document.getElementById('app');
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const q = document.getElementById('q');
    const stepsEl = document.getElementById('steps');
    const stepsHint = document.getElementById('stepsHint');
    const traceEl = document.getElementById('trace');
    const cfgModel = document.getElementById('cfgModel');
    const cfgTools = document.getElementById('cfgTools');
    const cfgMaxTurns = document.getElementById('cfgMaxTurns');

    // ---------- 折叠侧栏 ----------
    document.getElementById('toggleLeft').addEventListener('click', () => appEl.classList.toggle('hide-left'));
    document.getElementById('toggleRight').addEventListener('click', () => appEl.classList.toggle('hide-right'));
    requestAnimationFrame(() => {
      if (window.innerWidth < 980) { appEl.classList.add('hide-left', 'hide-right'); }
    });

    // ---------- 分析配置 ----------
    fetch('/config').then(r => r.json()).then(cfg => {
      cfgModel.textContent = cfg.model;
      cfgTools.textContent = (cfg.tools || []).join('、') || '（无）';
      if (cfg.default_max_turns) cfgMaxTurns.value = cfg.default_max_turns;
    }).catch(() => {
      cfgModel.textContent = '未知';
      cfgTools.textContent = '未知';
    });

    // ---------- 消息区 ----------
    function scrollBottom() { chat.parentElement.scrollTop = chat.parentElement.scrollHeight; }

    function addUser(text) {
      const d = document.createElement('div');
      d.className = 'msg user'; d.textContent = text;
      chat.appendChild(d); scrollBottom();
    }

    function addAssistant(md, chips, meta) {
      const d = document.createElement('div');
      d.className = 'msg assistant';

      const body = document.createElement('div');
      body.className = 'msg-body'; body.innerHTML = renderMd(md);
      d.appendChild(body);

      if (meta) {
        const details = document.createElement('details');
        details.className = 'msg-run';
        const summary = document.createElement('summary');
        summary.textContent = meta;
        details.appendChild(summary);
        if (chips && chips.length) {
          const tools = document.createElement('div');
          tools.className = 'run-tools';
          tools.innerHTML = chips.map(x => '<span class="tool-chip">🔧 ' + x + '</span>').join('');
          details.appendChild(tools);
        }
        d.appendChild(details);
      }

      chat.appendChild(d); scrollBottom();
    }

    const EXAMPLES = [
      '分析一下苹果公司（AAPL）的股价与基本面',
      '特斯拉（TSLA）最近财报表现如何',
      '英伟达（NVDA）最近有哪些重要新闻',
    ];
    function addExamples() {
      const wrap = document.createElement('div');
      wrap.className = 'examples';
      EXAMPLES.forEach(text => {
        const c = document.createElement('button');
        c.type = 'button'; c.className = 'example-chip'; c.textContent = text;
        c.addEventListener('click', () => { q.value = text; q.focus(); autoGrow(); });
        wrap.appendChild(c);
      });
      chat.appendChild(wrap); scrollBottom();
    }

    function addTyping() {
      const d = document.createElement('div');
      d.className = 'msg assistant typing'; d.id = 'typing';
      d.innerHTML = '分析中，请稍候 <span class="dots"><span></span><span></span><span></span></span>';
      chat.appendChild(d); scrollBottom();
    }

    addAssistant('你好，我是金融分析 Agent。输入一个问题（比如 AAPL 的股价与基本面分析），我会调用行情和财务工具后给你综合回答。');
    addExamples();

    // ---------- 左栏：实时步骤 ----------
    function newStepsRun(question) {
      stepsHint.style.display = 'none';
      const run = document.createElement('div');
      run.className = 'steps-run';
      const label = document.createElement('div');
      label.className = 'steps-q'; label.textContent = question;
      run.appendChild(label);
      stepsEl.insertBefore(run, stepsEl.firstChild); // 最新的排最上面
      return run;
    }
    function addStepEl(run, status, label) {
      const el = document.createElement('div');
      el.className = 'step ' + status;
      const l = document.createElement('div');
      l.className = 'step-label'; l.textContent = label;
      el.appendChild(l);
      run.appendChild(el);
      return el;
    }
    function setStepCaption(el, text) {
      if (!el) return;
      let cap = el.querySelector('.step-caption');
      if (!cap) { cap = document.createElement('div'); cap.className = 'step-caption'; el.appendChild(cap); }
      cap.textContent = text;
    }

    // ---------- 右栏：实时轨迹 ----------
    let traceStarted = false;
    function addTrace(text) {
      if (!traceStarted) { traceEl.innerHTML = ''; traceStarted = true; }
      const line = document.createElement('div');
      line.className = 'trace-line';
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      line.innerHTML = '<span class="t">' + time + '</span>' + escapeHtml(text);
      traceEl.appendChild(line);
      traceEl.scrollTop = traceEl.scrollHeight;
    }

    // ---------- SSE 事件处理 ----------
    function runAnalysis(question, maxTurns) {
      const run = newStepsRun(question);
      const thinkSteps = {};   // turn -> step el
      const toolQueue = [];    // 待匹配结果的工具 step
      addTrace('▶ 提问：' + question);
      addTyping();
      btn.disabled = true;

      fetch('/analyze/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, max_turns: maxTurns }),
      }).then(async (res) => {
        if (!res.ok || !res.body) {
          const data = await res.json().catch(() => ({}));
          document.getElementById('typing')?.remove();
          addAssistant('**错误**：' + JSON.stringify(data));
          btn.disabled = false;
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
            const line = chunk.split('\n').find(l => l.startsWith('data: '));
            if (!line) continue;
            handleEvent(JSON.parse(line.slice(6)), run, thinkSteps, toolQueue);
          }
        }
      }).catch((err) => {
        document.getElementById('typing')?.remove();
        addAssistant('**请求失败**：' + err);
      }).finally(() => {
        btn.disabled = false; q.focus();
      });
    }

    function handleEvent(evt, run, thinkSteps, toolQueue) {
      switch (evt.kind) {
        case 'turn.start':
          thinkSteps[evt.turn] = addStepEl(run, 'pending', '🧠 第 ' + evt.turn + ' 轮 · 分析中');
          addTrace('轮 ' + evt.turn + ' · 开始');
          break;
        case 'model.response': {
          const el = thinkSteps[evt.turn];
          if (el) { el.className = 'step done'; }
          const usage = evt.usage ? '（' + (evt.usage.prompt_tokens ?? '?') + '/' + (evt.usage.completion_tokens ?? '?') + ' tokens）' : '';
          addTrace('轮 ' + evt.turn + ' · 模型响应 · ' + evt.finish_reason + usage);
          break;
        }
        case 'tool.call': {
          const el = addStepEl(run, 'pending', '🔧 ' + evt.name);
          toolQueue.push(el);
          addTrace('轮 ' + evt.turn + ' · 调用 ' + evt.name + '(' + truncate(JSON.stringify(evt.arguments || {}), 60) + ')');
          break;
        }
        case 'tool.result': {
          const el = toolQueue.shift();
          if (el) { el.className = 'step done'; setStepCaption(el, truncate(evt.result, 70)); }
          addTrace('轮 ' + evt.turn + ' · ' + evt.name + ' 返回 · ' + String(evt.result || '').length + ' 字符');
          break;
        }
        case 'tool.error': {
          const el = toolQueue.shift();
          if (el) { el.className = 'step error'; setStepCaption(el, truncate(evt.error, 70)); }
          addTrace('轮 ' + evt.turn + ' · ' + evt.name + ' 出错 · ' + truncate(evt.error, 60));
          break;
        }
        case 'turn.final':
          addStepEl(run, 'done', '✅ 生成最终回答');
          addTrace('轮 ' + evt.turn + ' · 完成');
          break;
        case 'turn.max_turns':
          addStepEl(run, 'warn', '⚠️ 已达最大轮数上限');
          addTrace('达到最大轮数上限（' + evt.turns + '）');
          break;
        case 'done':
          document.getElementById('typing')?.remove();
          addAssistant(
            evt.final_answer || '（模型未给出最终答案）',
            evt.tool_calls_executed || [],
            '运行详情 · 轮数 ' + evt.turns + ' · 停止原因 ' + evt.stopped_by
          );
          addTrace('■ 完成 · 共 ' + evt.turns + ' 轮');
          break;
        case 'error':
          document.getElementById('typing')?.remove();
          addAssistant('**错误**：' + evt.message);
          addTrace('✕ 出错 · ' + evt.message);
          break;
      }
    }

    // ---------- 输入区 ----------
    function autoGrow() {
      q.style.height = 'auto';
      q.style.height = Math.min(q.scrollHeight, 160) + 'px';
    }
    q.addEventListener('input', autoGrow);
    q.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = q.value.trim();
      if (!text) return;
      addUser(text);
      q.value = ''; autoGrow();
      const maxTurns = Number(cfgMaxTurns.value) || 5;
      runAnalysis(text, maxTurns);
    });
  </script>
</body>
</html>
