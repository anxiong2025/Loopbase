[project]
name = "api"
version = "0.1.0"
description = "HTTP 服务：把 Loopbase 旅行攻略 Agent Runtime 暴露为 API"
requires-python = ">=3.14"
dependencies = ["fastapi", "uvicorn", "loopbase", "travel-agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
loopbase = { workspace = true }
travel-agent = { workspace = true }
