[project]
name = "travel-agent"
version = "0.1.0"
description = "旅行攻略领域包：真实信息工具、预算计算和旅行助手提示词"
requires-python = ">=3.14"
dependencies = ["loopbase"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.uv.sources]
loopbase = { workspace = true }
